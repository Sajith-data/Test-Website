<main>
    <h1>Contact Us</h1>

    <p>Complete the form below.</p>

    <form action="thank-you.html" method="get">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="message">Message</label>
        <textarea
            id="message"
            name="message"
            rows="5"
        ></textarea>

        <button type="submit" id="submit-enquiry">
            Submit Enquiry
        </button>

    </form>
</main>
