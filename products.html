<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products - My GA4 Test Website</title>

<!-- 1. Put your dataLayer line BEFORE the GTM snippet -->
<script>window.dataLayer = window.dataLayer || [];</script>

<!-- 2. Replace GTM-XXXXXXX with your container ID -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-5XDZP6DF');</script>

<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0 16px;background:#f7f8fc;color:#222}
  h1{color:#2a76e8}
  nav{background:#2a76e8;padding:14px 16px;margin:0 -16px 20px}
  nav a{color:#fff;font-weight:bold;margin-right:20px;text-decoration:none}
  button{background:#2a76e8;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer;font-size:14px}
  button.secondary{background:#e3e8f3;color:#222}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .card{background:#fff;border:1px solid #dde3f0;border-radius:8px;padding:16px}
  .card h3{margin:0 0 6px}
  .layout{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:16px}
  @media(max-width:700px){.layout{grid-template-columns:1fr}}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
  #msg{color:#1a7f37;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
  <h1>My GA4 Test Website</h1>
  <nav><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>

  <div class="layout">
    <section>
      <h2>Products</h2>
      <div class="grid" id="products"></div>
    </section>

    <aside class="card">
      <h2 style="margin-top:0">Your cart</h2>
      <div id="cart"></div>
      <p><strong>Total: $<span id="total">0.00</span></strong></p>
      <button id="checkoutBtn">Checkout</button>
      <div id="msg"></div>
    </aside>
  </div>

<script>
  // ---- Product catalogue (item_id / item_name / price follow the GA4 schema) ----
  const PRODUCTS = [
    {item_id:'SKU_001', item_name:'Blue T-Shirt', item_category:'Apparel', price:19.99},
    {item_id:'SKU_002', item_name:'Coffee Mug',   item_category:'Home',    price:9.50},
    {item_id:'SKU_003', item_name:'Notebook',     item_category:'Stationery', price:6.00},
    {item_id:'SKU_004', item_name:'Backpack',     item_category:'Bags',    price:49.00}
  ];
  let cart = [];            // [{...product, quantity}]
  let checkoutStarted = false;

  // ---- Helper: push a GA4 ecommerce event ----
  function track(eventName, items, extra) {
    const value = items.reduce((s, i) => s + i.price * i.quantity, 0);
    window.dataLayer.push({ ecommerce: null });   // clear the previous ecommerce object
    window.dataLayer.push({
      event: eventName,
      ecommerce: Object.assign({ currency: 'USD', value: +value.toFixed(2), items: items }, extra || {})
    });
  }

  // ---- Cart actions ----
  function addToCart(id) {
    const p = PRODUCTS.find(x => x.item_id === id);
    const line = cart.find(x => x.item_id === id);
    if (line) line.quantity++; else cart.push({...p, quantity: 1});
    track('add_to_cart', [{...p, quantity: 1}]);
    render();
  }

  function removeFromCart(id) {
    const line = cart.find(x => x.item_id === id);
    if (!line) return;
    track('remove_from_cart', [{...line}]);
    cart = cart.filter(x => x.item_id !== id);
    render();
  }

  function checkout() {
    if (!cart.length) return;
    if (!checkoutStarted) {            // begin_checkout once per checkout attempt
      track('begin_checkout', cart);
      checkoutStarted = true;
    }
    // In a real shop this happens after payment succeeds. Here we simulate it.
    track('purchase', cart, { transaction_id: 'T_' + Date.now() });
    document.getElementById('msg').textContent = 'Thanks! Order placed (test).';
    cart = []; checkoutStarted = false;
    render();
  }

  // ---- Rendering ----
  function render() {
    document.getElementById('products').innerHTML = PRODUCTS.map(p => `
      <div class="card">
        <h3>${p.item_name}</h3>
        <p>$${p.price.toFixed(2)}</p>
        <button data-add="${p.item_id}">Add to cart</button>
      </div>`).join('');

    document.getElementById('cart').innerHTML = cart.length
      ? cart.map(i => `
        <div class="row">
          <span>${i.item_name} × ${i.quantity}</span>
          <button class="secondary" data-remove="${i.item_id}">Remove</button>
        </div>`).join('')
      : '<p>Your cart is empty.</p>';

    document.getElementById('total').textContent =
      cart.reduce((s, i) => s + i.price * i.quantity, 0).toFixed(2);
  }

  document.addEventListener('click', e => {
    if (e.target.dataset.add) { document.getElementById('msg').textContent = ''; addToCart(e.target.dataset.add); }
    if (e.target.dataset.remove) removeFromCart(e.target.dataset.remove);
    if (e.target.id === 'checkoutBtn') checkout();
  });

  render();
</script>
</body>
</html>
